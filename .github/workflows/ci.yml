name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # All three SDKs, not just 10.0.x: building the net8.0 and net9.0 assets
      # needs their apphost packs, and running those tests needs their runtimes.
      # With only the 10.0 SDK installed the build fails with MSB3030 (apphost
      # not found) for every target framework below 10.
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Restore solution
        run: dotnet restore CoreSystem.Cache.sln

      - name: Build solution
        run: dotnet build CoreSystem.Cache.sln --configuration Release --no-restore

      - name: Check formatting
        run: dotnet format CoreSystem.Cache.sln --verify-no-changes --no-restore

      - name: Test solution
        run: dotnet test --solution CoreSystem.Cache.sln --configuration Release --no-build

      # Informational only. `dotnet list package --vulnerable` always exits 0,
      # even when it reports a High severity advisory, so this step cannot fail
      # the build and has no continue-on-error. The gate is the restore step
      # above: NuGetAudit raises NU1902/NU1903, and Directory.Build.props sets
      # TreatWarningsAsErrors, which turns those warnings into a hard failure.
      - name: Report vulnerable packages
        run: dotnet list CoreSystem.Cache.sln package --vulnerable --include-transitive
